name: Deploy to NullCore

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NullCore via Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH pull & restart
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NULLCORE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            nullcore@100.94.94.32 '
              cd /home/nullcore/b4d && \
              git fetch origin master && \
              git reset --hard origin/master && \
              sudo systemctl restart b4d-discord && \
              echo "Deploy OK: $(date)"
            '
